name: Prepare Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build and validate both standalone applications
        shell: pwsh
        run: ./build.ps1
      - name: Attach both applications to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = ([xml](Get-Content src/ApplicationVersion.props -Raw)).Project.PropertyGroup.Version
          $repositoryTag = 'V' + $version.Replace('.', '')
          if ($env:RELEASE_TAG -cne $repositoryTag -and $env:RELEASE_TAG -cnotmatch ('^[vV]?' + [regex]::Escape($version) + '$')) {
              throw "Release tag must match application version $version."
          }
          gh release create $env:RELEASE_TAG publish/odconv.exe publish/odconv-gui.exe publish/SHA256SUMS.txt --verify-tag --draft --title "OD.Converter $version" --notes-file docs/releases/windows-desktop.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
